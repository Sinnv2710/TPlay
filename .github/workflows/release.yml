name: Release

# Push a tag such as v1.2.0 and a signed APK is published as a GitHub Release.
# Obtainium watches the releases of this repo and offers the update on the phone.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          # versionCode must grow with every release: commit count is monotonic and stable
          # +100 keeps it above the test builds that were installed by hand with a larger code
          CODE="$(( $(git rev-list --count HEAD) + 100 ))"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.TPLAY_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tplay-release.jks"
          echo "TPLAY_KEYSTORE_PATH=$RUNNER_TEMP/tplay-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          TPLAY_KEYSTORE_PASSWORD: ${{ secrets.TPLAY_KEYSTORE_PASSWORD }}
          TPLAY_KEY_ALIAS: tplay
        run: >
          ./gradlew assembleRelease --console=plain
          -PversionName=${{ steps.ver.outputs.name }}
          -PversionCode=${{ steps.ver.outputs.code }}

      - name: Check signature and version
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:" 
          cp "$APK" "TPlay-${{ steps.ver.outputs.name }}.apk"
          sha256sum "TPlay-${{ steps.ver.outputs.name }}.apk" > "TPlay-${{ steps.ver.outputs.name }}.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "TPlay-${{ steps.ver.outputs.name }}.apk" \
            "TPlay-${{ steps.ver.outputs.name }}.apk.sha256" \
            --title "TPlay ${{ steps.ver.outputs.name }}" \
            --generate-notes
